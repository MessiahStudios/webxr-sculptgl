<!doctype html>
<html lang='en'>

<head>
  <meta charset='utf-8' />
  <meta name='description' content='WebXR Sculpt by Messiah Studios — Meta Quest MR/VR digital clay (stable).'>
  <meta name='author' content='Messiah Studios; original SculptGL by Stéphane Ginier'>
  <meta name='mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-capable' content='yes'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>

  <title>WebXR Sculpt</title>

  <link href='https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap' rel='stylesheet' type='text/css'>
  <link rel='stylesheet' href='css/yagui.css' type='text/css' />

  <script>
  'use strict';

  window.sketchfabOAuth2Config = {
    hostname: 'sketchfab.com',
    client_id: 'OWoAmrd1QCS9wB54Ly17rMl2i5AHGvDNfmN4pEUH',
    redirect_uri: 'https://stephaneginier.com/sculptgl/authSuccess.html'
  };

  window.addEventListener('load', function () {
    if (typeof window.SculptGL !== 'function') {
      console.error('WebXR Sculpt: sculptgl.js failed to load (check Network for 404).');
      return;
    }
    try {
      var app = new window.SculptGL();
      app.start();
    } catch (err) {
      console.error('WebXR Sculpt: start() failed', err);
    }
  });
  </script>
</head>

<body oncontextmenu='return false;'>
  <input type='file' id='fileopen' multiple accept='.obj,.ply,.stl,.sgl,.glb,.gltf,model/gltf-binary,model/gltf+json' style='display: none' />
  <input type='file' id='backgroundopen' style='display: none' />
  <input type='file' id='alphaopen' style='display: none' />
  <input type='file' id='textureopen' style='display: none' />
  <input type='file' id='matcapopen' style='display: none' />

  <div id='viewport'>
    <canvas id='canvas'></canvas>
  </div>

  <div id='webxr-dom-overlay-root' style='position:fixed;inset:0;pointer-events:none;z-index:2147483000;touch-action:manipulation;'>
    <div id='webxr-bar' style='pointer-events:auto;position:fixed;bottom:16px;right:16px;left:auto;z-index:1;display:none;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;width:auto;max-width:min(360px,calc(100vw - 32px));min-height:0;padding:8px;background:rgba(20,22,28,0.92);border-radius:10px;border:1px solid #444;font-family:Open Sans,sans-serif;box-sizing:border-box;box-shadow:0 6px 24px rgba(0,0,0,0.35);'>
      <button id='webxr-enter-mr' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:15px;'>
        XR setup…
      </button>
      <button id='webxr-exit' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #644;background:#422;color:#eee;font-size:15px;'>
        Exit MR
      </button>
      <button id='webxr-recenter' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#1f2a38;color:#eee;font-size:15px;'>
        Recenter
      </button>
      <button id='webxr-closer' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#24361f;color:#eee;font-size:15px;'>
        Closer
      </button>
      <button id='webxr-farther' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#24361f;color:#eee;font-size:15px;'>
        Farther
      </button>
      <button id='webxr-scale-down' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#2d2236;color:#eee;font-size:15px;'>
        Smaller
      </button>
      <button id='webxr-scale-up' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#2d2236;color:#eee;font-size:15px;'>
        Larger
      </button>
    </div>
  </div>

  <script src='sculptgl.js'></script>
</body>

</html>
