<!doctype html>
<html lang='en'>

<head>
  <meta charset='utf-8' />
  <meta name='description' content='WebXR Sculpt by Messiah Studios — WebXR-first digital clay for Desktop, VR, and Mixed Reality. Optimized for Meta Quest.'>
  <meta name='author' content='Messiah Studios; original SculptGL by Stéphane Ginier'>
  <meta name='mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-capable' content='yes'>

  <title>WebXR Sculpt | Messiah Studios</title>

  <link rel='stylesheet' type='text/css' href='https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap'>
  <link rel='stylesheet' type='text/css' href='css/yagui.css' />
  <link rel='stylesheet' type='text/css' href='//cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css' />

  <script type='text/javascript'>
  (function (i, s, o, g, r, a, m) {
    i['GoogleAnalyticsObject'] = r;
    i[r] = i[r] || function () {
      (i[r].q = i[r].q || []).push(arguments)
    }, i[r].l = 1 * new Date();
    a = s.createElement(o),
      m = s.getElementsByTagName(o)[0];
    a.async = 1;
    a.src = g;
    m.parentNode.insertBefore(a, m)
  })(window, document, 'script', '//www.google-analytics.com/analytics.js', 'ga');
  ga('create', 'UA-42431392-1', 'auto');
  ga('send', 'pageview');

  </script>

  <script src='//cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.js'></script>

  <script>
    'use strict';

    (window.adsbygoogle = window.adsbygoogle || []).push({});

    window.sketchfabOAuth2Config = {
      hostname: 'sketchfab.com',
      client_id: 'OWoAmrd1QCS9wB54Ly17rMl2i5AHGvDNfmN4pEUH',
      redirect_uri: 'https://stephaneginier.com/sculptgl/authSuccess.html'
    };

    window.addEventListener('load', function() {
      if (typeof window.SculptGL !== 'function') {
        console.error('SculptGL: window.SculptGL is missing. Is sculptgl.js loaded (check Network for 404/blocked)? Any red errors above this line?');
        return;
      }
      var app;
      try {
        app = new window.SculptGL();
        app.start();
      } catch (err) {
        console.error('SculptGL: start() failed', err);
        return;
      }

      var showAd = document.getElementById('adzone').clientWidth > 0;
      if (showAd && window.adsbygoogle.loaded) {
        window.cookieconsent.initialise({
          palette: {
            popup: { background: '#262b33' },
            button: { background: '#4d5766' }
          },
          theme: 'classic',
          position: 'bottom-left',
          content: {
            message: 'SculptGL uses cookies.',
            href: 'https://support.google.com/adsense/answer/7549925'
          }
        });

        window.postprocessGui = function() {
            var topBar = app.getGui()._topbar;
            topBar.domTopbar.style.paddingLeft = '160px';
            topBar.domTopbar.style.paddingRight = '170px';
        }
        window.postprocessGui();
      } else {
        var elt = document.getElementById('adzone');
        if (elt) elt.hidden = true; // issue with firefox otherwise
      }
    });
</script>
</head>

<body oncontextmenu='return false;'>
  <div id="adzone" style="position:absolute; z-index:10; padding-top:40px;">
    <style type="text/css">
    .adslot_1 { display: inline-block; width: 160px; height: 600px; }
    @media (max-width:900px) { .adslot_1 { display: none; } }
    </style>
    <!-- ad 1 -->
    <ins class="adsbygoogle adslot_1" data-ad-client="ca-pub-8279106136067661" data-ad-slot="6064702281"></ins>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
  </div>

  <input type='file' id='fileopen' multiple accept='.obj,.ply,.stl,.sgl,.glb,.gltf,model/gltf-binary,model/gltf+json' style='display: none' />
  <input type='file' id='backgroundopen' style='display: none' />
  <input type='file' id='alphaopen' style='display: none' />
  <input type='file' id='textureopen' style='display: none' />
  <input type='file' id='matcapopen' style='display: none' />

  <div id='viewport'>
    <canvas id='canvas'></canvas>
  </div>

  <div id='webxr-dom-overlay-root' style='position:fixed;inset:0;pointer-events:none;z-index:2147483000;touch-action:manipulation;'>
    <div id='webxr-bar' style='pointer-events:auto;position:fixed;bottom:16px;right:16px;left:auto;z-index:1;display:none;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;width:auto;max-width:min(360px,calc(100vw - 32px));min-height:0;padding:8px;background:rgba(20,22,28,0.92);border-radius:10px;border:1px solid #444;font-family:Open Sans,sans-serif;box-sizing:border-box;box-shadow:0 6px 24px rgba(0,0,0,0.35);'>
      <button id='webxr-enter-mr' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:15px;'>
        XR setup…
      </button>
      <button id='webxr-exit' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #644;background:#422;color:#eee;font-size:15px;'>
        Exit MR
      </button>
      <button id='webxr-recenter' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#1f2a38;color:#eee;font-size:15px;'>
        Recenter
      </button>
      <button id='webxr-closer' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#24361f;color:#eee;font-size:15px;'>
        Closer
      </button>
      <button id='webxr-farther' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#24361f;color:#eee;font-size:15px;'>
        Farther
      </button>
      <button id='webxr-scale-down' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#2d2236;color:#eee;font-size:15px;'>
        Smaller
      </button>
      <button id='webxr-scale-up' type='button' style='display:none;padding:10px 14px;min-height:44px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#2d2236;color:#eee;font-size:15px;'>
        Larger
      </button>
    </div>
  </div>

  <script src='sculptgl.js'></script>
  <script src='//cdn.webglstats.com/stat.js' defer='defer' async='async'></script>
</body>

</html>
